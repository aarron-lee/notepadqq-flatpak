on:
  push:
    branches:
      - "beta"
    tags:
      - "v*.*.*"

name: CI
jobs:
  flatpak:
    name: "Build Flatpak"
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-48
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: com.notepadqq
          manifest-path: com.notepadqq.Notepadqq.yaml
          build-bundle: true
          upload-artifact: true
          branch: beta
